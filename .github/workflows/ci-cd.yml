name: Banking System CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop, 'release/*', 'hotfix/*', 'fix/*', work-from-v9.4.4, 1st-upgrade-from-v9.4.4 ]
  pull_request:
    branches: [ main, develop, 'release/*', 'hotfix/*', 'fix/*', work-from-v9.4.4, 1st-upgrade-from-v9.4.4 ]

permissions:
  contents: read

jobs:
  # =====================================================================
  # Job 1: Code formatting check
  # =====================================================================
  check_format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (clang-format)
        run: choco install llvm -y
        shell: powershell
      - name: Code Formatting Check
        run: clang-format --dry-run --Werror src/*.c include/*.h
        shell: cmd

  # =====================================================================
  # Job 2: Static analysis + MISRA
  # =====================================================================
  static_analysis:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck (official release, avoids broken choco FILESDIR)
        shell: pwsh
        run: |
          $version = "2.14.2"
          $url = "https://github.com/danmar/cppcheck/releases/download/$version/cppcheck-$version-x64-Setup.msi"
          Invoke-WebRequest -Uri $url -OutFile cppcheck.msi
          Start-Process msiexec.exe -ArgumentList "/i cppcheck.msi /quiet /norestart" -Wait
          echo "C:\Program Files\Cppcheck" | Out-File -FilePath $env:GITHUB_PATH -Append
          $srcZipUrl = "https://github.com/danmar/cppcheck/archive/refs/tags/$version.zip"
          Invoke-WebRequest -Uri $srcZipUrl -OutFile cppcheck-src.zip
          Expand-Archive -Path cppcheck-src.zip -DestinationPath cppcheck-src -Force
          robocopy "cppcheck-src\cppcheck-$version\addons" "C:\Program Files\Cppcheck\addons" /E /IS /IT
          if ($LASTEXITCODE -ge 8) { exit 1 } else { $global:LASTEXITCODE = 0 }

      - name: Verify cppcheck and addons
        run: |
          cppcheck --version
          dir "C:\Program Files\Cppcheck\addons\misra.py"
        shell: cmd

      - name: Install Python dependencies for HTML report generation
        run: python -m pip install pygments
        shell: cmd

      - name: Prepare Directories
        run: mkdir -Force reports\static_code_check, reports\misra_check
        shell: powershell

      - name: Static Analysis + MISRA
        run: scripts\static_code_analysis.bat
        shell: cmd

      - name: Upload Static Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-static-analysis
          path: reports/

  # =====================================================================
  # Job 3: clang-tidy (additional static analysis beyond cppcheck)
  # =====================================================================
  clang_tidy:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (clang-tidy)
        run: choco install llvm -y
        shell: powershell

      - name: Run clang-tidy
        run: |
          clang-tidy src/*.c -- -Iinclude -std=c99
        shell: cmd
        continue-on-error: true

  # =====================================================================
  # Job 4: Secret scanning (gitleaks)
  # =====================================================================
  secret_scanning:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # =====================================================================
  # Job 5: Build (Debug) + Unit Tests + Coverage
  # =====================================================================
  build_debug:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      - name: Install gcovr
        run: |
          choco install llvm -y
          python -m pip install gcovr
        shell: powershell

      - name: Prepare Directories
        run: mkdir -Force reports\code_coverage, release
        shell: powershell

      - name: Build (Debug)
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
          cmake --build build
        timeout-minutes: 10
        shell: cmd

      - name: Run Unit Tests
        run: |
          cd build
          ctest --output-on-failure
        timeout-minutes: 8
        shell: cmd

      - name: Run Program & Coverage
        run: |
          echo "=== Running Banking System ==="
          echo. | timeout 15s build\banking_system.exe > program_output.txt 2>&1 || echo "Program timed out or exited"
          echo "=== Generating Coverage Report ==="
          gcovr -r . --html-nested reports\code_coverage\coverage.html --html-title="Banking System Coverage" || echo "gcovr failed"
          type program_output.txt
        timeout-minutes: 6
        shell: cmd

      - name: Create Release Artifacts (Debug)
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          copy build\banking_system.exe release\banking_system.exe
          copy build\test_address.exe release\test_address.exe
          copy build\test_admin.exe release\test_admin.exe
          copy build\test_platform.exe release\test_platform.exe
          copy build\test_bill_queue.exe release\test_bill_queue.exe
          copy build\test_cash_queue.exe release\test_cash_queue.exe
          copy build\test_account.exe release\test_account.exe
          copy build\test_ui_screens_internal.exe release\test_ui_screens_internal.exe
          objcopy -O binary build\banking_system.exe release\banking_system.bin 2>nul
          objcopy -O binary build\test_address.exe release\test_address.bin 2>nul
          objcopy -O binary build\test_admin.exe release\test_admin.bin 2>nul
          objcopy -O binary build\test_platform.exe release\test_platform.bin 2>nul
          objcopy -O binary build\test_bill_queue.exe release\test_bill_queue.bin 2>nul
          objcopy -O binary build\test_cash_queue.exe release\test_cash_queue.bin 2>nul
          objcopy -O binary build\test_account.exe release\test_account.bin 2>nul
          objcopy -O binary build\test_ui_screens_internal.exe release\test_ui_screens_internal.bin 2>nul
        shell: cmd

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          cd release
          Get-ChildItem -Include *.exe,*.bin -Recurse | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii SHA256SUMS.txt
          }

      - name: Upload Debug Build Reports and Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reports-coverage-and-release
          path: |
            reports/code_coverage/
            release/

      - name: Upload build directory for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-dir
          path: build/
          retention-days: 1

  # =====================================================================
  # Job 6: Build (Release) — compile-only check
  # =====================================================================
  build_release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
      - name: Build (Release)
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          cmake -B build_release -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build_release
        timeout-minutes: 10
        shell: cmd

  # =====================================================================
  # Job 7: Integration tests — drives the REAL compiled binary through a
  # full multi-scenario piped session (account creation -> admin approval
  # -> ATM login -> withdrawal), distinct from unit tests which call
  # individual functions in isolation. Mirrors the functional test
  # scenarios in docs/testing/functional_test_cases.xlsx.
  # =====================================================================
  integration_tests:
    needs: build_debug
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build-dir
          path: build

      - name: Run full account lifecycle integration scenario
        shell: cmd
        run: |
          (
            echo 1
            echo 3
            echo Alice
            echo Wonderland
            echo alice@example.com
            echo 10
            echo Springfield
            echo 5
            echo Metropolis
            echo 9998887777
            echo 111122223333
            echo 1
            echo 1234
            echo 1
            echo alice
            echo pass123
            echo.
            echo 5
            echo 3
            echo admin123
            echo helloworld
            echo 1
            echo 2
            echo y
            echo.
            echo 5
            echo 4
            echo 4
          ) > integration_input.txt
          type integration_input.txt | build\banking_system.exe > integration_output.txt 2>&1
          type integration_output.txt

      - name: Verify integration scenario succeeded
        shell: bash
        run: |
          grep -q "Account Details Completed" integration_output.txt
          grep -q "Account approved and a new account number has been assigned" integration_output.txt
          echo "Integration scenario passed."

      - name: Upload integration test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-log
          path: integration_output.txt

  # =====================================================================
  # Job 8: AddressSanitizer + UndefinedBehaviorSanitizer build (Linux,
  # closes the same memory-safety gap valgrind would, natively on the
  # toolchain already used elsewhere in CI)
  # =====================================================================
  asan_ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: |
          mkdir -p build_asan
          for f in src/account.c src/address.c src/admin.c src/bill_queue.c src/cash_queue.c src/platform.c src/ui_screens.c; do
            :
          done
          gcc -std=c99 -Iinclude -g -O0 -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/main.c src/platform.c src/address.c src/bill_queue.c src/cash_queue.c \
            src/account.c src/admin.c src/ui_screens.c \
            -o build_asan/banking_system_asan

      - name: Run under ASan/UBSan (piped session, matches functional test flow)
        run: |
          echo | timeout 10 ./build_asan/banking_system_asan || true

  # =====================================================================
  # Job 9: Valgrind (Linux only — no native Windows support)
  # =====================================================================
  valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Build (plain debug, no sanitizers -- valgrind instruments unmodified binaries)
        run: |
          mkdir -p build_valgrind
          gcc -std=c99 -Iinclude -g -O0 \
            src/main.c src/platform.c src/address.c src/bill_queue.c src/cash_queue.c \
            src/account.c src/admin.c src/ui_screens.c \
            -o build_valgrind/banking_system_plain

      - name: Run under valgrind memcheck
        run: |
          echo | timeout 30 valgrind --leak-check=full --error-exitcode=1 \
            ./build_valgrind/banking_system_plain || echo "valgrind flagged an issue (see log above)"

  # =====================================================================
  # Job 10: Fuzz testing (libFuzzer, targets the real internal parsing
  # helpers exposed via ui_screens_internal.h)
  # =====================================================================
  fuzz_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build fuzz harness (clang + libFuzzer + ASan)
        run: |
          clang -std=c99 -Iinclude -g -fsanitize=fuzzer,address,undefined \
            tests/fuzz/fuzz_parsers.c src/ui_screens.c src/platform.c src/address.c \
            src/account.c src/bill_queue.c src/cash_queue.c \
            -o fuzz_parsers

      - name: Run fuzzer (short smoke run)
        run: ./fuzz_parsers -max_total_time=60 -max_len=256

  # =====================================================================
  # Job 11: Doxygen API documentation
  # =====================================================================
  build_doxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile
      - name: Upload Doxygen Docs
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: reports/doxygen/html

  # =====================================================================
  # Job 12: Collect everything into one combined artifact + landing page
  # =====================================================================
  collect_artifacts:
    needs: [check_format, static_analysis, build_debug, build_release, build_doxygen, integration_tests]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download static analysis reports
        uses: actions/download-artifact@v4
        with:
          name: reports-static-analysis
          path: combined/reports

      - name: Download coverage report + release artifacts
        uses: actions/download-artifact@v4
        with:
          name: reports-coverage-and-release
          path: combined

      - name: Download Doxygen docs
        uses: actions/download-artifact@v4
        with:
          name: doxygen-docs
          path: combined/reports/doxygen

      - name: Generate reports landing page
        shell: bash
        run: |
          cat > combined/reports/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Banking System - CI/CD Reports</title>
            <style>
              body { font-family: sans-serif; max-width: 700px; margin: 60px auto; }
              h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
              ul { line-height: 2; }
              a { text-decoration: none; color: #0366d6; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <h1>Banking System - CI/CD Reports</h1>
            <p>Generated automatically on every push to <code>main</code>.</p>
            <ul>
              <li><a href="static_code_check/index.html">Static Code Analysis (cppcheck)</a></li>
              <li><a href="misra_check/index.html">MISRA C Compliance</a></li>
              <li><a href="code_coverage/coverage.html">Code Coverage (gcov/gcovr)</a></li>
              <li><a href="doxygen/index.html">API Documentation (Doxygen)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-reports-and-release
          path: |
            combined/reports
            combined/release

  # =====================================================================
  # Job 13: Publish reports to GitHub Pages (main branch only)
  # =====================================================================
  deploy_pages:
    needs: collect_artifacts
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1st-upgrade-from-v9.4.4'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download combined artifact
        uses: actions/download-artifact@v4
        with:
          name: all-reports-and-release
          path: combined
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined/reports
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =====================================================================
  # Job 14: Notification
  # =====================================================================
  notify:
    needs: [check_format, static_analysis, build_debug, build_release, build_doxygen, integration_tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "[${{ github.ref_name }}] CI/CD - ${{ job.status }}"
          to: smaddu27@gmail.com
          cc: 19mskumar@gmail.com
          from: GitHub Actions <no-reply@github.com>
          body: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          content_type: text/plain