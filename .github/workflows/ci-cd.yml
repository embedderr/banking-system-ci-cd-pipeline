name: Banking System CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop, 'release/*', 'feat/*', 'hotfix/*', 'fix/*' ]
  pull_request:
    branches: [ main, develop, 'release/*', 'feat/*', 'hotfix/*', 'fix/*' ]

permissions:
  contents: read

jobs:
  # =====================================================================
  # Job 1: Code formatting check (fast, no build toolchain needed)
  # =====================================================================
  check_format:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (clang-format)
        run: choco install llvm -y
        shell: powershell

      - name: Code Formatting Check
        run: clang-format --dry-run --Werror src/*.c include/*.h
        shell: cmd

  # =====================================================================
  # Job 2: Static analysis + MISRA (independent of the build toolchain)
  # =====================================================================
  static_analysis:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck (official release, avoids broken choco FILESDIR)
        shell: pwsh
        run: |
          $version = "2.14.2"
          $url = "https://github.com/danmar/cppcheck/releases/download/$version/cppcheck-$version-x64-Setup.msi"
          Invoke-WebRequest -Uri $url -OutFile cppcheck.msi
          Start-Process msiexec.exe -ArgumentList "/i cppcheck.msi /quiet /norestart" -Wait
          echo "C:\Program Files\Cppcheck" | Out-File -FilePath $env:GITHUB_PATH -Append

          $srcZipUrl = "https://github.com/danmar/cppcheck/archive/refs/tags/$version.zip"
          Invoke-WebRequest -Uri $srcZipUrl -OutFile cppcheck-src.zip
          Expand-Archive -Path cppcheck-src.zip -DestinationPath cppcheck-src -Force
          robocopy "cppcheck-src\cppcheck-$version\addons" "C:\Program Files\Cppcheck\addons" /E /IS /IT
          if ($LASTEXITCODE -ge 8) { exit 1 } else { $global:LASTEXITCODE = 0 }

      - name: Verify cppcheck and addons
        run: |
          cppcheck --version
          dir "C:\Program Files\Cppcheck\addons\misra.py"
        shell: cmd


      # ========== ADD THIS STEP ==========
      - name: Install Python dependencies for HTML reports
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygments
        shell: cmd
      # ===================================
        

      - name: Prepare Directories
        run: mkdir -Force reports\static_code_check, reports\misra_check
        shell: powershell

      - name: Static Analysis + MISRA
        run: scripts\static_code_analysis.bat
        shell: cmd

      - name: Upload Static Analysis Reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-static-analysis
          path: reports/

  # =====================================================================
  # Job 3: Build (Debug) only
  # =====================================================================
  build_debug:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake

      - name: Build (Debug with Coverage Flags)
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build
        timeout-minutes: 10
        shell: cmd

      - name: Upload Debug Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-build
          path: build/

  # =====================================================================
  # Job 4: Unit Tests (depends on build_debug)
  # =====================================================================
  unit_tests:
    needs: build_debug
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug Build
        uses: actions/download-artifact@v4
        with:
          name: debug-build
          path: build

      - name: Setup MSYS2 (for runtime libs if needed)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Run Unit Tests
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          cd build
          ctest --output-on-failure
        timeout-minutes: 8
        shell: cmd

  # =====================================================================
  # Job 5: Coverage Report (depends on build_debug)
  # =====================================================================
  coverage:
    needs: build_debug
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug Build
        uses: actions/download-artifact@v4
        with:
          name: debug-build
          path: build

      - name: Setup MSYS2 + Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip

      - name: Install gcovr
        run: python -m pip install gcovr
        shell: powershell

      - name: Prepare Directories
        run: mkdir -Force reports\code_coverage
        shell: powershell

      - name: Execute Tests & Generate Coverage Report
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          
          echo "=== Executing Unit Tests ==="
          cd build
          ctest --output-on-failure
          cd ..

          echo "=== Running Main Application ==="
          echo. | timeout 15s build\banking_system.exe > program_output.txt 2>&1 || echo "Program timed out or exited"

          echo "=== Generating Coverage Report ==="
          gcovr -r . --html-nested reports\code_coverage\coverage.html --html-title="Banking System Coverage" -e "build/deps/*" || echo "gcovr failed"
        timeout-minutes: 10
        shell: cmd      

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/code_coverage/

  # =====================================================================
  # Job 6: Create Release Artifacts (from Debug build)
  # =====================================================================
  create_release_artifacts:
    needs: build_debug
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Download Debug Build
        uses: actions/download-artifact@v4
        with:
          name: debug-build
          path: build

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Create Release Artifacts & Generate Checksums
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          mkdir release
          copy build\banking_system.exe release\banking_system.exe
          copy build\test_address.exe release\test_address.exe
          copy build\test_admin.exe release\test_admin.exe
          copy build\test_platform.exe release\test_platform.exe
          copy build\test_bill_queue.exe release\test_bill_queue.exe
          copy build\test_cash_queue.exe release\test_cash_queue.exe
          copy build\test_account.exe release\test_account.exe
          copy build\test_ui_screens_internal.exe release\test_ui_screens_internal.exe

          objcopy -O binary build\banking_system.exe release\banking_system.bin 2>nul
          objcopy -O binary build\test_address.exe release\test_address.bin 2>nul
          objcopy -O binary build\test_admin.exe release\test_admin.bin 2>nul
          objcopy -O binary build\test_platform.exe release\test_platform.bin 2>nul
          objcopy -O binary build\test_bill_queue.exe release\test_bill_queue.bin 2>nul
          objcopy -O binary build\test_cash_queue.exe release\test_cash_queue.bin 2>nul
          objcopy -O binary build\test_account.exe release\test_account.bin 2>nul
          objcopy -O binary build\test_ui_screens_internal.exe release\test_ui_screens_internal.bin 2>nul

          echo === Generating SHA-256 Checksums ===
          cd release
          powershell -Command "Get-ChildItem -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize Hash, Path" > checksums.txt
          type checksums.txt
        shell: cmd

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release/

  # =====================================================================
  # Job 7: Build (Release) — compile-only
  # =====================================================================
  build_release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake

      - name: Build (Release)
        run: |
          set PATH=C:\msys64\mingw64\bin;%PATH%
          cmake -B build_release -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
          cmake --build build_release
        timeout-minutes: 10
        shell: cmd


  # =====================================================================
  # Job 8: Generate Doxygen Documentation
  # =====================================================================
  build_doxygen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen + Graphviz
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen Documentation
        run: doxygen Doxyfile

      - name: Upload Doxygen Docs
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-docs
          path: reports/doxygen/html



  # =====================================================================
  # Job 9: Collect everything
  # =====================================================================
  collect_artifacts:
    needs: [check_format, static_analysis, build_debug, unit_tests, coverage, create_release_artifacts, build_release, build_doxygen]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Download static analysis reports
        uses: actions/download-artifact@v4
        with:
          name: reports-static-analysis
          path: combined/reports

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: combined/reports/code_coverage

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: combined/release

      - name: Download Doxygen docs
        uses: actions/download-artifact@v4
        with:
          name: doxygen-docs
          path: combined/reports/doxygen    

      - name: Generate reports landing page
        shell: bash
        run: |
          cat > combined/reports/index.html << EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Banking System - CI/CD Reports</title>
            <style>
              :root {
                --bg: #0d1117;
                --card: #161b22;
                --border: #30363d;
                --text: #e6edf3;
                --muted: #8b949e;
                --accent: #58a6ff;
                --green: #3fb950;
              }
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
                background: var(--bg);
                color: var(--text);
                line-height: 1.5;
                padding: 40px 20px;
              }
              .container { max-width: 860px; margin: 0 auto; }
              header { margin-bottom: 40px; }
              h1 { font-size: 1.8rem; margin-bottom: 8px; }
              .meta {
                color: var(--muted);
                font-size: 0.95rem;
                display: flex;
                flex-wrap: wrap;
                gap: 12px 24px;
                margin-top: 12px;
              }
              .meta span { display: flex; align-items: center; gap: 6px; }
              .meta a { color: var(--accent); text-decoration: none; }
              .meta a:hover { text-decoration: underline; }
              .grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                gap: 16px;
              }
              .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 20px;
                transition: border-color 0.15s;
              }
              .card:hover { border-color: var(--accent); }
              .card h3 { font-size: 1.1rem; margin-bottom: 6px; }
              .card p { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
              .card a {
                display: inline-block;
                color: var(--accent);
                text-decoration: none;
                font-weight: 500;
                font-size: 0.95rem;
              }
              .card a:hover { text-decoration: underline; }
              footer {
                margin-top: 50px;
                padding-top: 20px;
                border-top: 1px solid var(--border);
                color: var(--muted);
                font-size: 0.85rem;
                text-align: center;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <h1>Banking System — CI/CD Reports</h1>
                <div class="meta">
                  <span>Branch: <strong>${{ github.ref_name }}</strong></span>
                  <span>Commit: <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></span>
                  <span>Run: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a></span>
                  <span>Generated: $(date -u +"%Y-%m-%d %H:%M UTC")</span>
                </div>
              </header>
              

              <div class="info-box">
                <strong>Version / Changelog:</strong>
                <a href="https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md">View CHANGELOG.md</a>
                &nbsp;|&nbsp;
                <strong>License:</strong> MIT (pending)
                &nbsp;|&nbsp;
                <strong>Authors:</strong> embedderr
              </div>

              <div class="grid">
                <div class="card">
                  <h3>Static Code Analysis</h3>
                  <p>Cppcheck results (bugs, style, performance...)</p>
                  <a href="static_code_check/index.html">Open Report →</a>
                </div>

                <div class="card">
                  <h3>MISRA C Compliance</h3>
                  <p>MISRA C:2012 checks via cppcheck addon</p>
                  <a href="misra_check/index.html">Open Report →</a>
                </div>

                <div class="card">
                  <h3>Code Coverage</h3>
                  <p>Line & function coverage (gcovr)</p>
                  <a href="code_coverage/coverage.html">Open Report →</a>
                </div>

                <div class="card">
                  <h3>API Documentation</h3>
                  <p>Doxygen generated docs + call graphs</p>
                  <a href="doxygen/index.html">Open Docs →</a>
                </div>
              </div>

              <footer>
                Automatically generated by GitHub Actions • Banking System CI/CD
              </footer>
            </div>
          </body>
          </html>
          EOF

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-reports-and-release
          path: |
            combined/reports
            combined/release

            

  # =====================================================================
  # Job 10: Deploy to GitHub Pages (main only)
  # =====================================================================
  deploy_pages:
    needs: collect_artifacts
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/doxygen_github_pages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download combined artifact
        uses: actions/download-artifact@v4
        with:
          name: all-reports-and-release
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/  # <-- CHANGE THIS FROM combined/reports/ TO reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  # =====================================================================
  # Job 11: Notification
  # =====================================================================
  notify:
    needs: [check_format, static_analysis, build_debug, unit_tests, coverage, create_release_artifacts, build_release, build_doxygen, deploy_pages]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine overall pipeline status
        id: pipeline_status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "status=FAILED" >> $GITHUB_OUTPUT
          else
            echo "status=SUCCESS" >> $GITHUB_OUTPUT
          fi

      - name: Send Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_APP_PASSWORD }}
          subject: "[${{ github.ref_name }}] CI/CD Pipeline - ${{ steps.pipeline_status.outputs.status }}"
          to: smaddu27@gmail.com
          cc: 19mskumar@gmail.com
          from: GitHub Actions <no-reply@github.com>
          body: |
            Pipeline Status: ${{ steps.pipeline_status.outputs.status }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          content_type: text/plain