name: Banking System CI/CD

on:
  push:
    branches: [ main, develop, 'release/*' ]
  pull_request:
    branches: [ main, develop, 'release/*' ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip

    - name: Install Tools
      run: |
        choco install llvm -y
        python -m pip install gcovr
        choco install cppcheck -y
      shell: powershell

    - name: Prepare Directories
      run: |
        mkdir -Force reports\static_code_check, reports\misra_check, reports\code_coverage, release
      shell: powershell

    - name: Code Formatting
      run: clang-format --dry-run --Werror -i src/*.c include/*.h
      shell: cmd

    - name: Static Analysis + MISRA
      run: scripts\static_code_analysis.bat
      shell: cmd
      continue-on-error: true

    - name: Build
      run: |
        set PATH=C:\msys64\mingw64\bin;%PATH%
        cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
        cmake --build build
      shell: cmd

    - name: Run Unit Tests
      run: build\test_account.exe
      shell: cmd

    - name: Run Program & Coverage
      run: |
        build\banking_system.exe
        gcovr -r . --html-nested reports\code_coverage\coverage.html --html-title="Banking System Coverage"
      shell: cmd

    - name: Create Release Artifacts
      run: |
        copy build\banking_system.exe release\banking_system.exe
        copy build\test_account.exe release\test_account.exe
      shell: cmd

    - name: Upload All Reports and Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-reports-and-release
        path: |
          reports/
          release/

    - name: Send Notification to Dev Team
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_APP_PASSWORD }}
        subject: "[${{ github.ref_name }}] CI/CD - ${{ job.status }}"
        to: maddusomesh2000@gmail.com
        from: GitHub Actions <no-reply@github.com>
        body: |
          Pipeline Status: ${{ job.status }}
          Branch: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        content_type: text/plain