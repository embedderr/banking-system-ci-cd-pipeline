name: Banking System CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-cppcheck
          mingw-w64-x86_64-python
          mingw-w64-x86_64-python-pip

    - name: Install clang-format
      run: choco install llvm -y
      shell: powershell

    - name: Install gcovr via pip
      run: python -m pip install gcovr
      shell: cmd

    - name: Code Formatting Check
      run: clang-format --dry-run --Werror -i src/*.c include/*.h
      shell: cmd

    - name: Static Analysis + MISRA
      run: scripts\static_code_analysis.bat
      shell: cmd

    - name: Build
      run: |
        set PATH=C:\msys64\mingw64\bin;%PATH%
        cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Debug
        cmake --build build
      shell: cmd

    - name: Run Unit Tests
      run: build\test_account.exe
      shell: cmd

    - name: Run Main Program & Coverage
      run: |
        build\banking_system.exe
        gcovr -r . --html-nested reports\coverage.html --html-title="Banking System Coverage"
      shell: cmd

    - name: Upload Reports
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-reports
        path: |
          reports/coverage.html
          reports/static_code_check/
          reports/misra_check/