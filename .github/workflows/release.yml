name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake

    - name: Install Tools
      run: |
        choco install llvm -y
        python -m pip install gcovr
      shell: powershell

    - name: Extract Version
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "VERSION=${VERSION}" >> $GITHUB_ENV

    - name: Build
      run: |
        set PATH=C:\msys64\mingw64\bin;%PATH%
        cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
        cmake --build build
      shell: cmd

    - name: Create Binary Files & Rename with Version
      run: |
        objcopy -O binary build\banking_system.exe build\banking_system_%VERSION%.bin
        objcopy -O binary build\test_account.exe build\test_account_%VERSION%.bin
        copy build\banking_system.exe build\banking_system_%VERSION%.exe
        copy build\test_account.exe build\test_account_%VERSION%.exe
      shell: cmd
      env:
        VERSION: ${{ env.VERSION }}

    - name: Determine target branch for changelog commit
      id: branch
      shell: bash
      run: |
        RAW_VERSION=${GITHUB_REF#refs/tags/v}
        if [[ "$RAW_VERSION" == *"-rc"* ]]; then
          BASE=${RAW_VERSION%%-rc*}
          MAJOR_MINOR=$(echo "$BASE" | cut -d. -f1,2)
          TARGET_BRANCH="release/$MAJOR_MINOR"
        else
          TARGET_BRANCH="main"
        fi
        echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
        echo "Target branch resolved to: $TARGET_BRANCH"

    - name: Checkout target branch
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin ${TARGET_BRANCH}
        git checkout ${TARGET_BRANCH}

    - name: Generate Changelog
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
      env:
        OUTPUT: CHANGELOG.md

    - name: Commit and push updated CHANGELOG.md
      shell: bash
      run: |
        git add CHANGELOG.md
        if git diff --cached --quiet; then
          echo "No changes to CHANGELOG.md"
        else
          git commit -m "docs: update CHANGELOG.md for ${VERSION} [skip ci]"
          git push origin ${TARGET_BRANCH}
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/banking_system_${{ env.VERSION }}.exe
          build/test_account_${{ env.VERSION }}.exe
          build/banking_system_${{ env.VERSION }}.bin
          build/test_account_${{ env.VERSION }}.bin
          CHANGELOG.md
        tag_name: ${{ github.ref }}
        name: Banking System ${{ env.VERSION }}
        generate_release_notes: true
        prerelease: ${{ contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_APP_PASSWORD }}
        subject: "Banking System Release ${{ github.ref }} - ${{ job.status }}"
        to: 19mskumar@gmail.com
        cc: smaddu27@gmail.com
        from: GitHub Actions <no-reply@github.com>
        body: |
          Release Status: ${{ job.status }}
          Version: ${{ github.ref }}
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        content_type: text/plain