name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake

    - name: Install Tools
      run: |
        choco install llvm -y
        python -m pip install gcovr
      shell: powershell

    - name: Build
      run: |
        set PATH=C:\msys64\mingw64\bin;%PATH%
        cmake -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release
        cmake --build build
      shell: cmd

    - name: Create Binary Files
      run: |
        objcopy -O binary build\banking_system.exe build\banking_system.bin
        objcopy -O binary build\test_account.exe build\test_account.bin
      shell: cmd

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/banking_system.exe
          build/test_account.exe
          build/banking_system.bin
          build/test_account.bin
          reports/code_coverage/coverage.html
        tag_name: ${{ github.ref }}
        name: Banking System ${{ github.ref }}
        generate_release_notes: true
        prerelease: ${{ contains(github.ref, 'rc') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send Notification
      if: always()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_APP_PASSWORD }}
        subject: "Banking System Release ${{ github.ref }} - ${{ job.status }}"
        to: 19mskumar@gmail.com
        cc: smaddu27@gmail.com
        from: GitHub Actions <no-reply@github.com>
        body: |
          Release Status: ${{ job.status }}
          Version: ${{ github.ref }}
          Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        content_type: text/plain